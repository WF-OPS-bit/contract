name: Release

# CD：push 形如 v1.0.0 的 tag 时，打包并把 jar 发布到 GitHub Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: "Build & Publish Release"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Java version from pom.xml
        id: jv
        run: |
          V=$(sed -n 's/.*<java.version>\(.*\)<\/java.version>.*/\1/p' pom.xml | head -n 1)
          case "$V" in
            1.8|8)   echo "version=8"  >> "$GITHUB_OUTPUT" ;;
            11)      echo "version=11" >> "$GITHUB_OUTPUT" ;;
            17)      echo "version=17" >> "$GITHUB_OUTPUT" ;;
            21)      echo "version=21" >> "$GITHUB_OUTPUT" ;;
            *)       echo "version=21" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Set up JDK ${{ steps.jv.outputs.version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.jv.outputs.version }}
          cache: maven

      - name: Package
        run: mvn -B -ntp clean package -DskipTests

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: target/*.jar
