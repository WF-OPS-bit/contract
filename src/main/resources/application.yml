# 合同智能审核系统 - 应用配置
server:
  port: 8081
  servlet:
    context-path: /api
spring:
  application:
    name: contract-approval-system
  servlet:
    multipart:
      # 9.3 模板文件上传大小限制(默认只有 1MB,docx 很容易超)
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    # 老师数据库 ${DB_HOST:127.0.0.1} (contract_review 已建好 27 张表)
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:3306/contract_review?useUnicode=true&characterEncoding=UTF-8&serverTimezone=GMT%2B8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    type: com.alibaba.druid.pool.DruidDataSource
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      # 注意：数据库表名就是 sys_user / contract_contract 等（无 t_ 前缀），
      # 因此不配置 table-prefix，实体 SysUser 直接映射表 sys_user
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: -1
  type-aliases-package: com.ar.contractreview.entity

# MyBatis-Plus 分页插件方言（自建配置项，非 MP 官方属性）。
# 默认 MYSQL；H2 profile 下由 application-h2.yml 覆盖为 H2。
app:
  datasource:
    db-type: ${APP_DB_TYPE:MYSQL}

# JWT 配置（SpringSecurity 登录用）
jwt:
  token:
    expire: 60
    sign: ${JWT_SIGN:contract-review-jwt-secret-change-in-production-2026-secure}

# ---------------------------------------------------------------------------
# Python AI 服务（FastAPI）—— Java 后端内部调用，前端不直连
#   启动方式： cd python-ai-service && python run.py
# ---------------------------------------------------------------------------
python:
  ai:
    base-url: ${PYTHON_AI_BASE_URL:http://localhost:8000}
    # 连接超时：Python 没启动时要快速失败，不要挂住请求
    connect-timeout-seconds: 5
    # 读超时：真实 LLM 审核长文本较慢，给足余量；offline 模式毫秒级返回
    read-timeout-seconds: 300

# ---------------------------------------------------------------------------
# 合同文件存储目录（上传后按 UUID 重命名落盘）
# 默认放在运行目录的 upload/contracts 下，避免依赖 D 盘
# ---------------------------------------------------------------------------
contract:
  upload:
    dir: ${CONTRACT_UPLOAD_DIR:${user.dir}/upload/contracts/}
